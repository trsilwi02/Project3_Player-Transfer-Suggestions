name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_transfer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_transfer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_transfer
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/football_transfer
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/football_transfer
      JWT_SECRET: ci-test-jwt-secret-with-at-least-32-characters
      REFRESH_TOKEN_PEPPER: ci-test-refresh-pepper-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
